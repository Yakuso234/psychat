services:
  mysql:
    image: mysql:8.0.36
    container_name: ai-mysql1
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ai_companion
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2.4
    container_name: ai-redis1
    ports:
      - "6380:6379"
    command: redis-server
    volumes:
      - redis-data:/data
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.12
    container_name: ai-etcd1
    ports:
      - "2379:2379"
    environment:
      ETCD_ADVERTISE_CLIENT_URLS: http://etcd:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
    volumes:
      - etcd-data:/etcd-data
    restart: always

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: ai-minio1
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data
    volumes:
      - minio-data:/data
    restart: always

  milvus:
    image: milvusdb/milvus:v2.4.5
    container_name: ai-milvus1
    ports:
      - "19530:19530"
      - "9091:9091"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    command: milvus run standalone
    depends_on:
      - etcd
      - minio
    restart: always

volumes:
  mysql-data:
  redis-data:
  etcd-data:
  minio-data:
